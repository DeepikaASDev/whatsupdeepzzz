<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bright Smile Dental – Chat</title>
<style>
  :root { --brand: #0f766e; --bg: #f5f7f7; --ink: #1f2937; --muted: #6b7280; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink);
         display: flex; justify-content: center; min-height: 100vh; }
  .chat { width: 100%; max-width: 480px; display: flex; flex-direction: column; height: 100vh; background: #fff;
          box-shadow: 0 0 24px rgba(0,0,0,.06); }
  header { background: var(--brand); color: #fff; padding: 16px 20px; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 2px 0 0; font-size: 13px; opacity: .85; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; line-height: 1.4; white-space: pre-wrap; font-size: 15px; }
  .user { align-self: flex-end; background: var(--brand); color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #eef2f2; border-bottom-left-radius: 4px; }
  .meta { align-self: flex-start; font-size: 11px; color: var(--muted); margin-top: -6px; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e5e7eb; }
  input { flex: 1; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 24px; font-size: 15px; outline: none; }
  input:focus { border-color: var(--brand); }
  button { background: var(--brand); color: #fff; border: 0; border-radius: 24px; padding: 0 18px; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<main class="chat">
  <header>
    <h1>Bright Smile Dental</h1>
    <p>AI front desk · book, reschedule or cancel</p>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Type a message…" maxlength="1000" aria-label="Message">
    <button id="send" type="submit">Send</button>
  </form>
</main>
<script>
  const sessionId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())).replace(/[^A-Za-z0-9_-]/g, "");
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  function add(text, cls) {
    const el = document.createElement("div");
    el.className = cls;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  add("Hi! I'm the Bright Smile Dental assistant. I can answer questions or book an appointment. How can I help?", "msg bot");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    add(message, "msg user");
    input.value = "";
    send.disabled = true;
    const typing = add("…", "msg bot");
    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || ("HTTP " + res.status));
      typing.textContent = data.reply;
      const bits = [data.latency_ms + " ms"];
      if (data.tool_calls.length) bits.push("tools: " + data.tool_calls.join(", "));
      if (data.guardrail) bits.push("guardrail: " + data.guardrail);
      add(bits.join(" · "), "meta");
    } catch (err) {
      typing.textContent = "Sorry, something went wrong. " + (typeof err.message === "string" && !err.message.startsWith("HTTP") ? err.message : "Please try again.");
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
